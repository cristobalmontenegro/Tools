<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Retenciones SRI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        
        #drop-zone {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: #3498db;
            transition: background 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #drop-zone.hover { background-color: #ebf5fb; border-color: #2980b9; }
        
        .actions { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.9em;
        }
        th { background-color: #f8f9fa; color: #2c3e50; }
        tr:hover { background-color: #f1f1f1; }
        .monto { text-align: right; font-family: monospace; font-weight: bold; }
        .count { margin-top: 10px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lector de Retenciones XML</h1>
    <p class="subtitle">Arrastra tus archivos XML del SRI aquí para extraer los datos</p>

    <div id="drop-zone">
        Arrastra los archivos XML aquí o haz clic para seleccionarlos
        <input type="file" id="file-input" multiple accept=".xml" style="display:none">
    </div>

    <div class="actions">
        <button onclick="exportarExcel()">Copiar Tabla para Excel</button>
    </div>

    <div class="count" id="contador">Archivos procesados: 0</div>
    
    <table id="tabla-retenciones">
        <thead>
            <tr>
                <th>Fecha Emisión</th>
                <th>Número Retención</th>
                <th>Agente de Retención</th>
                <th>RUC Agente</th>
                <th>Renta (Fuente)</th>
                <th>IVA</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const tablaBody = document.querySelector('#tabla-retenciones tbody');
    const contador = document.getElementById('contador');
    let totalProcesados = 0;

    // Manejo del Drop Zone
    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('hover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        procesarArchivos(e.dataTransfer.files);
    };
    fileInput.onchange = (e) => procesarArchivos(e.target.files);

    function procesarArchivos(files) {
        Array.from(files).forEach(file => {
            if (file.name.endsWith('.xml')) {
                const reader = new FileReader();
                reader.onload = (e) => interpretarXML(e.target.result);
                reader.readAsText(file);
            }
        });
    }

    function interpretarXML(contenido) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(contenido, "text/xml");
        
        // El SRI suele envolver el comprobante en un CDATA dentro de <comprobante>
        let comprobanteXmlStr = xmlDoc.getElementsByTagName("comprobante")[0]?.textContent;
        
        if (!comprobanteXmlStr) return; // No es un formato reconocido

        const compDoc = parser.parseFromString(comprobanteXmlStr, "text/xml");

        // Extracción de datos básicos
        const infoTributaria = compDoc.getElementsByTagName("infoTributaria")[0];
        const infoComp = compDoc.getElementsByTagName("infoCompRetencion")[0];
        
        const fecha = infoComp.getElementsByTagName("fechaEmision")[0]?.textContent || "";
        const secuencial = infoTributaria.getElementsByTagName("secuencial")[0]?.textContent || "";
        const razonSocial = infoTributaria.getElementsByTagName("razonSocial")[0]?.textContent || "";
        const ruc = infoTributaria.getElementsByTagName("ruc")[0]?.textContent || "";

        // Extracción de impuestos (Sumamos por tipo)
        let totalRenta = 0;
        let totalIva = 0;

        const retenciones = compDoc.getElementsByTagName("retencion");
        for (let ret of retenciones) {
            const codigo = ret.getElementsByTagName("codigo")[0]?.textContent;
            const valor = parseFloat(ret.getElementsByTagName("valorRetenido")[0]?.textContent || 0);
            
            if (codigo === "1") totalRenta += valor; // Renta / Fuente
            if (codigo === "2") totalIva += valor;   // IVA
        }

        agregarFila(fecha, secuencial, razonSocial, ruc, totalRenta, totalIva);
    }

    function agregarFila(fecha, sec, rs, ruc, renta, iva) {
        const row = tablaBody.insertRow();
        row.innerHTML = `
            <td>${fecha}</td>
            <td>${sec}</td>
            <td>${rs}</td>
            <td>${ruc}</td>
            <td class="monto">${renta.toFixed(2).replace('.', ',')}</td>
            <td class="monto">${iva.toFixed(2).replace('.', ',')}</td>
        `;
        totalProcesados++;
        contador.innerText = `Archivos procesados: ${totalProcesados}`;
    }

    function exportarExcel() {
        const table = document.getElementById('tabla-retenciones');
        const range = document.createRange();
        range.selectNode(table);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        try {
            document.execCommand('copy');
            alert('Tabla copiada al portapapeles. Ahora puedes pegarla directamente en Excel (Ctrl + V).');
        } catch (err) {
            alert('Error al copiar. Por favor selecciona la tabla manualmente.');
        }
        window.getSelection().removeAllRanges();
    }
</script>

</body>
</html>
